<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Complaint Registration</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<p class="back"><a href="../index.html">&larr; All tasks</a></p>
<h1>Online Complaint Registration</h1>
<form action="#" method="post" enctype="multipart/form-data">
<fieldset><legend>Complaint details</legend>
<label for="cat">Category</label>
<select id="cat" name="category" required><option value="">-- Select --</option><option>Billing</option><option>Product quality</option><option>Service delay</option><option>Staff behaviour</option><option>Other</option></select>
<p>Priority:
<label style="display:inline"><input type="radio" name="priority" value="low" required> Low</label>
<label style="display:inline"><input type="radio" name="priority" value="medium"> Medium</label>
<label style="display:inline"><input type="radio" name="priority" value="high"> High</label></p>
<label for="desc">Description</label><textarea id="desc" name="description" rows="5" cols="50" required></textarea>
<label for="file">Attachment</label><input type="file" id="file" name="attachment" accept=".jpg,.png,.pdf">
</fieldset>
<fieldset><legend>Contact details</legend>
<label for="n">Name</label><input type="text" id="n" name="name" required>
<label for="e">Email</label><input type="email" id="e" name="email" required>
<label for="p">Phone</label><input type="tel" id="p" name="phone">
<label for="d">Preferred resolution date</label><input type="date" id="d" name="resolution_date">
</fieldset>
<p><label style="display:inline"><input type="checkbox" required> I confirm the details are correct.</label></p>
<button type="submit">Submit complaint</button> <button type="reset">Reset</button>
</form></body></html>
